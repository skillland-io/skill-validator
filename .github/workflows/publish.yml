# Publishes to npm with trusted publishing (OIDC): no npm token is stored anywhere.
# npm needs this file name, publish.yml, in the package's Trusted Publisher settings.
#
# Runs on every push to main. When the version in package.json is not on npm yet,
# it checks, publishes, then tags the commit and creates the GitHub Release.
# To release: merge a PR that bumps "version" in package.json.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # creates the tag and the GitHub Release
  id-token: write # lets npm verify this workflow instead of a token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Is this version already on npm?
        id: version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@^11.5.1
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run check
      - if: steps.version.outputs.publish == 'true'
        run: npm publish
      - name: Tag and create the GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
