# Publishes to npm with trusted publishing (OIDC): no npm token is stored anywhere.
# npm needs this file name, publish.yml, in the package's Trusted Publisher settings.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow instead of a token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - run: npm install -g npm@^11.5.1
      - name: Check the release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public
