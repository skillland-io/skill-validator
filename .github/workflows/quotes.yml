# Weekly: checks that every quoted source sentence still appears on its page,
# and opens an issue when a vendor has edited their docs.
name: Source quotes

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: check
        run: npm run --silent check-quotes > quotes.txt
        continue-on-error: true
      - if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat quotes.txt
          title="Source quotes no longer match their pages"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body-file quotes.txt
          fi
          exit 1
